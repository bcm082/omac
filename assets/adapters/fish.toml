name = "fish"
description = "fish syntax colors (universal variables)"

[detect]
bins = ["fish"]

[[steps]]
kind = "cmd"
run = '''fish -c 'set -U fish_color_normal {{ foreground_strip }}; set -U fish_color_command {{ green_strip }}; set -U fish_color_keyword {{ magenta_strip }}; set -U fish_color_quote {{ green_strip }}; set -U fish_color_redirection {{ cyan_strip }}; set -U fish_color_end {{ cyan_strip }}; set -U fish_color_error {{ red_strip }}; set -U fish_color_param {{ foreground_strip }}; set -U fish_color_comment {{ dark_foreground_strip }}; set -U fish_color_operator {{ cyan_strip }}; set -U fish_color_escape {{ cyan_strip }}; set -U fish_color_autosuggestion {{ muted_strip }}; set -U fish_color_selection --background={{ selection_strip }}; set -U fish_color_search_match --background={{ selection_strip }}; set -U fish_pager_color_prefix {{ accent_strip }}; set -U fish_pager_color_progress {{ dark_foreground_strip }}; set -U fish_pager_color_description {{ dark_foreground_strip }}' '''
