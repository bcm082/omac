name = "fzf"
description = "fzf colors through FZF_DEFAULT_OPTS_FILE (new fzf runs update instantly)"
hint = "Open shells need `exec zsh` once to export FZF_DEFAULT_OPTS_FILE."

[detect]
bins = ["fzf"]

[[steps]]
kind = "write"
template = "fzfrc.tpl"
target = "{{ generated }}/fzfrc"

[[steps]]
kind = "write"
content = '''
# Generated by omac. fzf reads its colors from this file on every run.
[[ -z $FZF_DEFAULT_OPTS_FILE ]] && export FZF_DEFAULT_OPTS_FILE="$HOME/.config/omac/generated/fzfrc"
'''
target = "~/.config/omac/shell/fzf.zsh"

[[steps]]
kind = "block"
file = "~/.zshrc"
id = "shell"
content = "for f in ~/.config/omac/shell/*.zsh(N); do source \"$f\"; done"
